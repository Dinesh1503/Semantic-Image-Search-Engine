services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vector_db
    restart: unless-stopped
    environment: 
      - POSTGRES_USER=max
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=image_db
    ports: 
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
