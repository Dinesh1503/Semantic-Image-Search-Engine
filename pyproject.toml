[project]
name = "engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "mlx-vlm>=0.3.9 ; sys_platform == 'darwin'",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.2",
    "sqlalchemy>=2.0.45",
    "torch>=2.9.1",
    "torch-vision>=0.1.6.dev0",
    "transformers>=4.57.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "numpy>=1.26",
]

[tool.pytest.ini_options]
pythonpath = ["engine"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["engine"]

